name: Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Patches (.mpp & .jar)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon \
            -Pgpr.user="${{ github.actor }}" \
            -Pgpr.key="${{ secrets.GITHUB_TOKEN }}"

      - name: Publish Custom Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.9.9
          name: "Morphe Patches v9.9.9"
          body: "Custom build with 4-mode fullscreen video scale."
          files: |
            **/build/libs/*.mpp
            **/build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
