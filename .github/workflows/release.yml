name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Android Patches (.mpp with DEX)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon \
            -Pgpr.user="${{ github.actor }}" \
            -Pgpr.key="${{ secrets.GITHUB_TOKEN }}"

      # 自動從產生的 .mpp 檔名中擷取版本號（例如 1.46.0）
      - name: Get Version
        id: get_version
        run: |
          FILE=$(find patches/build/libs -name "patches-*.mpp" ! -name "*-javadoc.mpp" ! -name "*-sources.mpp" | head -n 1)
          VERSION=$(basename "$FILE" | sed -E 's/patches-(.+)\.mpp/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 發布時動態使用抓到的版本號
      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "Morphe Patches v${{ steps.get_version.outputs.version }}"
          body: "Auto build with Traditional Chinese captions and Smart video scale mode."
          files: |
            patches/build/libs/patches-*.mpp
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
